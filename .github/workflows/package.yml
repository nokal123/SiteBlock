# Rebuilds the installable SiteBlock package whenever app code is pushed to master, and publishes it
# as a new GitHub Release for that version, marked latest, so the newest version is always at one fixed download link:
#   https://github.com/nokal123/SiteBlock/releases/latest/download/SiteBlock.zip
# Steps: build on a fresh Apple Silicon Mac, run every test (a failing test stops the run, so a
# broken package is never published), run scripts/package.sh, then publish SiteBlock.zip and version.json
# as a new release v<version>, keeping the older releases and their download counts (the file the app reads to learn the newest version and the zip's checksum).
name: Build and publish package

on:
  push:
    branches: [master]
    # App and test changes rebuild the package; edits to docs or design plans alone do not.
    paths:
      - "Sources/**"
      # Tests decide whether a package is published, so a change to them rebuilds too.
      - "Tests/**"
      - "Resources/**"
      - "scripts/**"
      - "Package.swift"
      - "Install SiteBlock.command"
      - ".github/workflows/package.yml"
  # Also allows a manual run from the repository's Actions tab.
  workflow_dispatch:

# Replacing the release needs permission to write to the repository's releases.
permissions:
  contents: write

# A newer push cancels a run still in progress, so the newest code always wins.
concurrency:
  group: package
  cancel-in-progress: true

jobs:
  package:
    # macos-26 runs on Apple Silicon (arm64), which is what SiteBlock is built for, and has the macOS 26 SDK. The SDK an app is
    # built with decides its look and layout on newer macOS, so building with an older SDK makes the panel look and behave differently.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          # The whole history, because the build number is the count of commits. A shallow checkout would count 1.
          fetch-depth: 0

      - name: Show the build tools
        run: |
          sw_vers
          swift --version
          uname -m
          xcrun --sdk macosx --show-sdk-version

      # Stops before building when the macOS SDK is older than 26, so a package that looks different from the tested app is never published.
      - name: Require the macOS 26 SDK
        run: |
          SDK="$(xcrun --sdk macosx --show-sdk-version)"
          if [ "${SDK%%.*}" -lt 26 ]; then echo "::error title=Old SDK::The macOS SDK is $SDK; SiteBlock must be built with 26 or newer."; exit 1; fi

      # Runs the unit and integration tests. The integration tests start the real daemon in sandbox
      # mode (a temporary folder in place of /etc/hosts and the system folders), so they need no root.
      # Each failed test line (marked ✘) also becomes an error annotation, because annotations show on
      # the public run page, while the full log can only be read by someone logged in to GitHub.
      - name: Run the tests
        run: |
          set -o pipefail
          scripts/test.sh 2>&1 | tee test-output.log || {
            grep '✘' test-output.log | head -20 | while IFS= read -r line; do echo "::error title=Failed test::$line"; done
            exit 1
          }

      # Builds the release programs, signs them ad hoc and writes dist/SiteBlock.zip and dist/version.json.
      - name: Build the package
        run: scripts/package.sh

      - name: Keep the zip as a run artifact
        uses: actions/upload-artifact@v6
        with:
          name: SiteBlock-package
          path: |
            dist/SiteBlock.zip
            dist/version.json
          retention-days: 30

      # Creates a new release for this version, tagged v<version> (for example v1.2.3), and marks it as the latest one.
      # Older releases are kept, so GitHub keeps each version's download counts (scripts/stats.sh adds them up). The
      # links .../releases/latest/download/SiteBlock.zip and .../version.json always point at the release marked latest.
      # The one release once published under the tag "latest" is removed first, so that tag name never shadows those links.
      - name: Publish this version as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(jq -r '.displayVersion // .version' dist/version.json)"
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true
          gh release create "v$VERSION" dist/SiteBlock.zip dist/version.json \
            --latest \
            --target "${{ github.sha }}" \
            --title "SiteBlock $VERSION" \
            --notes "Built automatically from commit ${{ github.sha }}.

          To install on an Apple Silicon Mac with macOS 14 or newer: download SiteBlock.zip, unzip it, and follow INSTALL.txt inside (right-click \"Install SiteBlock.command\" and choose Open). version.json describes this build and is what the SiteBlock app reads to check for updates."
